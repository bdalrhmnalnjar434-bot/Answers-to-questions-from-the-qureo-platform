
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول المالك | TXT Vault</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/animations.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">
      <span class="brand-icon">T</span> TXT Vault
    </a>
    <a href="index.html">العودة للموقع</a>
  </header>

  <main class="form-wrap">
    <div class="panel">
      <span class="eyebrow">OWNER ACCESS</span>
      <h1>دخول المالك</h1>
      <p>سجّل الدخول للوصول إلى لوحة إدارة الملفات.</p>

      <form id="loginForm" class="form">
        <label>
          البريد الإلكتروني
          <input class="field" type="email" id="email"
            autocomplete="username" required>
        </label>
        <label>
          كلمة المرور
          <input class="field" type="password" id="password"
            autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary" type="submit">
          تسجيل الدخول
        </button>
      </form>

      <p id="message" class="message" role="status"></p>
    </div>
  </main>

  <script type="module" src="JS/auth.js"></script>
  <script src="JS/animations.js"></script>
  <script src="lock.js"></script>
</body>
</html>
